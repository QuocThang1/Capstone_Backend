steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'asia-southeast1-docker.pkg.dev/$PROJECT_ID/taska/taska-backend:$COMMIT_SHA',
        '.'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'asia-southeast1-docker.pkg.dev/$PROJECT_ID/taska/taska-backend:$COMMIT_SHA'
      ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'taska-backend',
        '--image',
        'asia-southeast1-docker.pkg.dev/$PROJECT_ID/taska/taska-backend:$COMMIT_SHA',
        '--region',
        'asia-southeast1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/taska/taska-backend:$COMMIT_SHA'
